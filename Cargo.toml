[package]
name = "md-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A lightweight, single-binary Markdown viewer for the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xmhha/md-viewer"
readme = "README.md"
publish = false

[[bin]]
name = "mdv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.59", default-features = false }
# Alpha: pinned exactly because its API still changes between releases.
merman = { version = "=0.10.0-alpha.2", default-features = false, features = [
    "ascii",
    "svg",
    "diagram-block",
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-packet",
    "diagram-sequence",
    "diagram-state",
    "diagram-xychart",
] }
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
serde_json = "1"
terminal_size = "0.4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "fs", "stdio", "process"] }

[dev-dependencies]
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# merman is most of the binary; built for size it stays well under the
# 20MB limit, and diagrams still draw in a few milliseconds.
[profile.release.package.merman]
opt-level = "s"
[profile.release.package.merman-ascii]
opt-level = "s"
[profile.release.package.merman-core]
opt-level = "s"
[profile.release.package.merman-markup]
opt-level = "s"
[profile.release.package.merman-model]
opt-level = "s"
[profile.release.package.merman-render]
opt-level = "s"
[profile.release.package.dugong]
opt-level = "s"
[profile.release.package.dugong-graphlib]
opt-level = "s"
