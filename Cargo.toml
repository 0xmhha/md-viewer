[package]
name = "md-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A lightweight, single-binary Markdown viewer for the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xmhha/md-viewer"
readme = "README.md"
publish = false

[[bin]]
name = "mdv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.59", default-features = false }
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
terminal_size = "0.4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "fs", "stdio", "process"] }

[dev-dependencies]
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
