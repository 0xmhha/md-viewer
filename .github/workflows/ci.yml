name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest stable toolchain
        # rust-toolchain.toml names the stable channel, not a version, and
        # runner images can carry an older stable than developers have.
        # Update it so clippy and rustc match a fresh local install.
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
